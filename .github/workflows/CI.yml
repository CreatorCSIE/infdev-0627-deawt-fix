name: CI

# 构建验证：编译 + shadowJar 产物。
# 静态自证 harness 依赖本地启动器素材（%APPDATA%/.attic/versions 实 jar），
# hosted runner 无素材，不在 CI 跑 —— harness 仍是本地验收路径（gradlew harness）。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('build.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean compileJava compileTestJava shadowJar

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: infdev-windowfix-CI
          path: build/libs/infdev-windowfix-*.jar
          if-no-files-found: error
