name: Nightly

# push 到 main 时构建 shadowJar，生成 sha256/size meta，上传为 workflow artifact（保留 14 天）。
# 不发 nightly release/tag——钉版正式 Release 属 Phase 3（手动），不在本流程。

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'            # 文档改动不触发 nightly
  workflow_dispatch:

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('build.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean shadowJar

      - name: Generate meta (sha256 + size)
        id: meta
        run: |
          JAR=$(ls build/libs/infdev-windowfix-*.jar | head -n1)
          {
            echo "file=$(basename "$JAR")"
            echo "sha256=$(sha256sum "$JAR" | cut -d' ' -f1)"
            echo "size=$(stat -c%s "$JAR")"
            echo "commit=${GITHUB_SHA}"
            echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > nightly-meta.txt
          cat nightly-meta.txt
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: infdev-windowfix-nightly
          path: |
            ${{ steps.meta.outputs.jar }}
            nightly-meta.txt
          if-no-files-found: error
          retention-days: 14
